[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solaris-board"
version = "0.1.0"
description = "Solaris — markdown-native project board for humans and AI agents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "DevMandalia" }]
keywords = [
  "project-management",
  "markdown",
  "kanban",
  "agents",
  "cli",
  "obsidian",
  "git",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Project Management",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/DevMandalia/Solaris"
Repository = "https://github.com/DevMandalia/Solaris"
Issues = "https://github.com/DevMandalia/Solaris/issues"
Documentation = "https://github.com/DevMandalia/Solaris#readme"

[project.scripts]
solaris = "solaris.cli:main"
# Compat alias
solaris-board = "solaris.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
solaris = ["py.typed", "data/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
