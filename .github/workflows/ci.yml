name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest -q
      - name: CLI smoke
        run: |
          solaris init --root /tmp/solaris-ci --name CI --project Eng
          export BOARD_ROOT=/tmp/solaris-ci
          solaris task create --title "CI task" --project Eng --build
          solaris task move ci-task --lane done
          solaris export --include-done | head -20
